<script>
const INK='#1d3b5c',cv=document.getElementById('c');let ctx=cv.getContext('2d');

let W,H,S=1,dpr,horizon,sandY,T=0,t=0,st='idle',lives=5,score=0,level=0,prevLevel=0,typed='',lastSpawn=-9,streak=0,levelTime=0,shake=0,flash=0,badTimer,matchTimer,best=0;
let bubbles=[],decoys=[],parts=[],floats=[];
try{best=+localStorage.getItem('bmb-best')||0}catch(e){}
const speck=Array.from({length:140},()=>[Math.random(),Math.random(),1+Math.random()*3]);
// phones and tablets get a lighter scene and lighter audio so they stay smooth
const LITE=!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
const DECOYS=LITE?40:100;

// bubble sprites in three tints
const sprites=['160,225,255','255,190,225','190,255,215'].map(c=>{
  const s=document.createElement('canvas');s.width=s.height=128;const g=s.getContext('2d');
  const r=g.createRadialGradient(54,50,6,64,64,60);
  r.addColorStop(0,'rgba(255,255,255,.55)');r.addColorStop(.7,`rgba(${c},.28)`);r.addColorStop(1,`rgba(${c},.65)`);
  g.fillStyle=r;g.beginPath();g.arc(64,64,58,0,7);g.fill();
  g.lineWidth=4;g.strokeStyle='rgba(29,59,92,.75)';g.stroke();
  g.strokeStyle='rgba(255,255,255,.95)';g.lineWidth=6;g.lineCap='round';g.beginPath();g.arc(64,64,42,3.5,4.4);g.stroke();
  return s;
});

function resize(){
  const nd=Math.min(devicePixelRatio||1,2),nw=$('play').clientWidth,nh=$('play').clientHeight;
  if(nw===W&&nh===H&&nd===dpr)return; // nothing changed: don't reallocate the canvas
  dpr=nd;W=nw;H=nh;
  S=Math.max(.75,Math.min(1,Math.min(W,H*1.2)/700));
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  horizon=H*.4;sandY=LITE?H-Math.max(48,H*.12):H-Math.max(90,H*.2);
  bake();
  if(!decoys.length)for(let i=0;i<DECOYS;i++)decoys.push(newDecoy(true));
}
function newDecoy(init){
  const r=(6+Math.random()*16)*S;
  return{x:Math.random()*W,y:init?Math.random()*H:-r-Math.random()*H*.5,r,v:H*(.05+Math.random()*.07),ph:Math.random()*6,sp:rnd(0,2),a:.45+Math.random()*.4};
}
if(window.ResizeObserver)new ResizeObserver(resize).observe($('play'));else addEventListener('resize',resize);

// static layers, rebuilt only on resize so each frame does less work
let sandG,skyBase,sandBase,sandTop;
function bake(){
  const skyG=ctx.createLinearGradient(0,0,0,horizon);skyG.addColorStop(0,'#5fcbff');skyG.addColorStop(1,'#d9f5ff');
  const seaG=ctx.createLinearGradient(0,horizon,0,sandY+20);seaG.addColorStop(0,'#4fd3df');seaG.addColorStop(1,'#0e8fb8');
  sandG=ctx.createLinearGradient(0,sandY,0,H);sandG.addColorStop(0,'#dcae64');sandG.addColorStop(.12,'#f3d28f');sandG.addColorStop(1,'#f8e0a8');
  // sky and sea gradients (copying an image is much cheaper than filling a gradient every frame)
  skyBase=document.createElement('canvas');skyBase.width=Math.ceil(W*dpr);skyBase.height=Math.max(1,Math.ceil((sandY+30)*dpr));
  const k=skyBase.getContext('2d');k.setTransform(dpr,0,0,dpr,0,0);
  k.fillStyle=skyG;k.fillRect(0,0,W,horizon+2);k.fillStyle=seaG;k.fillRect(0,horizon,W,sandY-horizon+30);
  // everything below the wavy sand edge (gradient, specks, starfish) never moves
  sandTop=sandY+9;sandBase=document.createElement('canvas');
  sandBase.width=Math.ceil(W*dpr);sandBase.height=Math.max(1,Math.ceil((H-sandTop)*dpr));
  const c=ctx;ctx=sandBase.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,-sandTop*dpr);
  ctx.fillStyle=sandG;ctx.fillRect(0,sandTop,W,H-sandTop);
  ctx.fillStyle='rgba(160,110,50,.35)';
  ctx.beginPath();for(const[a,b,r]of speck){const x=a*W,y=sandY+34+b*(H-sandY-34);ctx.moveTo(x+r,y);ctx.arc(x,y,r,0,7)}ctx.fill();
  star(W*.12,sandY+(H-sandY)*.55,20,.3);star(W*.82,sandY+(H-sandY)*.72,13,-.4);
  ctx=c;
}

// equations
function gen(){
  const L=Math.min(level,8),M=[9,9,15,25,50,100,300,600,999][L];
  for(let n=0;n<50;n++){
    const k=Math.random(),w=L===0?[.5,1,1]:L===1?[.4,.8,1]:[.3,.6,.8];let eq,a,b,ans;
    if(k<w[0]){a=rnd(2,M);b=rnd(2,M);eq=`${a} + ${b}`;ans=a+b}
    else if(k<w[1]){a=rnd(3,M);b=rnd(1,a-1);eq=`${a} − ${b}`;ans=a-b}
    else if(k<w[2]){const A=[0,5,5,9,12,15,25,40,60][L];a=rnd(2,A);b=rnd(2,[0,5,5,9,9,9,9,9,9][L]);eq=Math.random()<.5?`${a} × ${b}`:`${b} × ${a}`;ans=a*b}
    else{b=rnd(2,[0,0,5,9,9,12,12,12,12][L]);const q=rnd(2,[0,0,5,9,12,12,15,20,25][L]);a=b*q;eq=`${a} ÷ ${b}`;ans=q}
    if(!bubbles.some(o=>o.ans===ans))return{eq,ans};
  }
  return{eq:'1 + 1',ans:2};
}
function spawn(){
  const{eq,ans}=gen();ctx.font=F(26*S);
  const r=Math.max(42*S,ctx.measureText(eq).width/2+16*S);let x=W/2;
  for(let i=0;i<25;i++){
    x=r+20+Math.random()*(W-2*r-40);
    if(!bubbles.some(o=>o.y<250&&Math.abs(o.x0-x)<o.r+r+16))break;
  }
  bubbles.push({x0:x,x,y:-r-4,r,v:H*(.0525+Math.random()*.02),eq,ans,ph:Math.random()*6});
  lastSpawn=t;
}

// effects
function splash(x,y,n,c){for(let i=0;i<n;i++){const a=-Math.PI*Math.random(),s=80+Math.random()*240;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.6+Math.random()*.4,m:1,r:2+Math.random()*4,c})}}
function burst(x,y,n,c){for(let i=0;i<n;i++){const a=Math.random()*6.3,s=60+Math.random()*220;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.4,m:1,r:2+Math.random()*5,c})}}
function float(x,y,txt,c,size,life){floats.push({x,y,txt,c,size,l:life||1})}

// input
function hud(){
  $('sc').textContent=score;$('bs').textContent=best;$('lv').textContent=level+1;
  $('hearts').innerHTML='♥'.repeat(Math.max(lives,0))+'<span style="opacity:.3">'+'♥'.repeat(5-Math.max(lives,0))+'</span>';
}
function showAns(){ans.textContent=typed||'\u00a0'}
// ---- sound (all synthesized, no files) ----
let AC,master,oceanG,white,clapBuf,clapBuilding=false,sleepTimer,soundOn=true;
function noise(brown){const n=AC.sampleRate*2,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;if(brown){l=(l+.02*w)/1.02;d[i]=l*8}else d[i]=w}return b}
function loopFilter(buf,type,freq,q){const s=AC.createBufferSource();s.buffer=buf;s.loop=true;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;s.connect(f);s.start();return f}
function lfo(hz,depth,param){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=hz;g.gain.value=depth;o.connect(g);g.connect(param);o.start()}
function initAudio(){
  if(AC){wake();return}
  try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  master=AC.createGain();master.gain.value=soundOn?1:0;master.connect(AC.destination);
  oceanG=AC.createGain();oceanG.gain.value=0;oceanG.connect(master);
  white=noise(false);
  // steady, soft water texture: no swells, no waves
  const rumble=loopFilter(noise(true),'lowpass',200,.5),sg=AC.createGain();sg.gain.value=.04;rumble.connect(sg);sg.connect(oceanG);
  const hiss=loopFilter(white,'lowpass',1100,.3),hg=AC.createGain();hg.gain.value=.006;hiss.connect(hg);hg.connect(oceanG);
  // warm pad: a soft D major 6/9 chord with slow breathing and a long reverb tail.
  // The reverb is a constant CPU load, so phones get the pad without it.
  const pad=AC.createGain();pad.gain.value=.11;
  const plp=AC.createBiquadFilter();plp.type='lowpass';plp.frequency.value=900;pad.connect(plp);
  const dry=AC.createGain();dry.gain.value=LITE?1:.6;plp.connect(dry);dry.connect(oceanG);
  if(!LITE){
    const ir=AC.createBuffer(2,AC.sampleRate*3,AC.sampleRate);
    for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<d.length;i++){const k=1-i/d.length;d[i]=(Math.random()*2-1)*k*k*k}}
    const verb=AC.createConvolver();verb.buffer=ir;
    const wet=AC.createGain();wet.gain.value=1;
    plp.connect(verb);verb.connect(wet);wet.connect(oceanG);
  }
  [[146.83,.5],[220,.42],[329.63,.28],[369.99,.2],[493.88,.12]].forEach(([f,a],i)=>{
    [-4,4].forEach(dt=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;o.detune.value=dt;g.gain.value=a*.5;lfo(.025+i*.011,a*.35,g.gain);o.connect(g);g.connect(pad);o.start()});
  });
}
// Pause the whole audio engine whenever nothing should be heard, so it uses no CPU.
function wake(){clearTimeout(sleepTimer);if(AC&&soundOn&&st==='play'&&!document.hidden&&AC.state==='suspended')AC.resume()}
function sleep(delay){clearTimeout(sleepTimer);if(!AC)return;sleepTimer=setTimeout(()=>{if(AC.state==='running')AC.suspend()},delay)}
function oceanFade(on){if(AC&&oceanG)oceanG.gain.setTargetAtTime(on?1:0,AC.currentTime,on?3:1.5);if(on)wake();else sleep(6000)}
const SPK='<path d="M4 9h4l5-4v14l-5-4H4z"/>';
function sndIcon(){const b=$('snd');b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+SPK+(soundOn?'<path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/>':'<path d="M16 9.5l5 5M21 9.5l-5 5"/>')+'</svg>';b.setAttribute('aria-label',soundOn?'Mute sound':'Turn sound on')}
sndIcon();
function toggleSound(){soundOn=!soundOn;sndIcon();if(master)master.gain.setTargetAtTime(soundOn?1:0,AC.currentTime,.05);if(soundOn)wake();else sleep(300)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)sleep(0);else wake()});
function sPop(){
  if(!AC||!soundOn)return;const t0=AC.currentTime,f=500+Math.random()*500;
  const o=AC.createOscillator(),g=AC.createGain();o.type='sine';
  o.frequency.setValueAtTime(f,t0);o.frequency.exponentialRampToValueAtTime(f*2.6,t0+.06);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.35,t0+.005);g.gain.exponentialRampToValueAtTime(.0001,t0+.12);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+.15);
  const n=AC.createBufferSource();n.buffer=white;const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=2500;
  const ng=AC.createGain();ng.gain.setValueAtTime(.2,t0);ng.gain.exponentialRampToValueAtTime(.0001,t0+.04);
  n.connect(hp);hp.connect(ng);ng.connect(master);n.start(t0);n.stop(t0+.05);
}
function sWrong(){
  if(!AC||!soundOn)return;const t0=AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();o.type='square';
  o.frequency.setValueAtTime(190,t0);o.frequency.setValueAtTime(135,t0+.09);
  lp.type='lowpass';lp.frequency.value=900;
  g.gain.setValueAtTime(.16,t0);g.gain.setValueAtTime(.16,t0+.15);g.gain.exponentialRampToValueAtTime(.0001,t0+.22);
  o.connect(lp);lp.connect(g);g.connect(master);o.start(t0);o.stop(t0+.25);
}
// The applause is rendered once, off the live audio graph, into a buffer that is
// replayed on every level-up. Building ~1000 live nodes per level-up froze phones.
function sClap(){
  if(!AC||!soundOn)return;
  if(clapBuf){const s=AC.createBufferSource();s.buffer=clapBuf;s.connect(master);s.start(AC.currentTime+.03);return}
  buildClap();
}
function buildClap(){
  if(clapBuf||clapBuilding||!AC||!window.OfflineAudioContext)return;clapBuilding=true;
  const sr=AC.sampleRate,oc=new OfflineAudioContext(2,Math.ceil(sr*5.2),sr);
  renderClap(oc,oc.destination,LITE?110:190);
  const done=b=>{clapBuf=b;clapBuilding=false};
  const p=oc.startRendering();if(p&&p.then)p.then(done,()=>{clapBuilding=false});else oc.oncomplete=e=>done(e.renderedBuffer);
}
function renderClap(AC,out,voices){
  const D=3.4,t0=.03,sr=AC.sampleRate;
  // a hall full of people: soft room reverb behind a crowd of overlapping claps
  const ir=AC.createBuffer(2,sr*1.6,sr);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.5)}
  const verb=AC.createConvolver();verb.buffer=ir;
  const bus=AC.createGain(),lp=AC.createBiquadFilter(),dry=AC.createGain(),wet=AC.createGain();
  bus.gain.value=1.3*Math.sqrt(190/voices);lp.type='lowpass';lp.frequency.value=4500;dry.gain.value=.55;wet.gain.value=.7;
  bus.connect(lp);lp.connect(dry);lp.connect(verb);verb.connect(wet);dry.connect(out);wet.connect(out);
  for(let n=0;n<voices;){
    let t=Math.random()*D;
    if(Math.random()>Math.min(t/.5,1)*Math.min((D-t)/1.2,1))continue;
    n++;
    if(Math.random()<.55)t=Math.round(t/.22)*.22+(Math.random()-.5)*.07;
    t=Math.max(0,t)+t0;
    const s=AC.createBufferSource();s.buffer=white;
    const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=500;
    const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=900+Math.random()*1500;bp.Q.value=.7+Math.random();
    const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.03+Math.random()*.06,t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+.03+Math.random()*.04);
    s.connect(hp);hp.connect(bp);bp.connect(g);
    if(AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=Math.random()*1.6-.8;g.connect(p);p.connect(bus)}else g.connect(bus);
    s.start(t,Math.random()*(white.duration-.1));s.stop(t+.09);
  }
}
function release(){bubbles.forEach(b=>b.hold=false)}
const vis=b=>b.y-b.r>=0;
function check(){
  clearTimeout(matchTimer);clearTimeout(badTimer);release();if(!typed)return;
  const pre=bubbles.filter(b=>vis(b)&&String(b.ans).startsWith(typed));
  if(!pre.length){
    ans.classList.remove('bad');void ans.offsetWidth;ans.classList.add('bad');sWrong();
    badTimer=setTimeout(()=>{typed='';ans.classList.remove('bad');showAns()},280);return;
  }
  const hits=bubbles.filter(b=>vis(b)&&String(b.ans)===typed).sort((a,b)=>b.y-a.y);
  if(!hits.length)return;
  const hit=hits[0],longer=pre.some(b=>b!==hit&&String(b.ans)!==typed);
  if(!longer)pop(hit);
  else{hit.hold=true;matchTimer=setTimeout(()=>{if(st==='play'&&bubbles.includes(hit)&&typed===String(hit.ans))pop(hit);else release();showAns()},650)}
}
function pop(b){
  bubbles.splice(bubbles.indexOf(b),1);typed='';showAns();
  sPop();const pts=10+5*level;score+=pts;streak++;burst(b.x,b.y,18,'180,230,255');burst(b.x,b.y,8,'255,255,255');
  float(b.x,b.y,'+'+pts,'#14995a',34);
  if(score>best){best=score}hud();
}
function lose(b){
  bubbles.splice(bubbles.indexOf(b),1);lives--;streak=0;flash=1;sWrong();shake=.35;
  splash(b.x,sandY,26,'255,107,87');float(b.x,sandY-30,'Splash!','#ff6b57',34);hud();
  if(lives<=0)end();
}
function start(){
  if(st==='play')return;
  st='play';t=0;lives=5;score=0;level=0;prevLevel=0;streak=0;levelTime=0;typed='';bubbles=[];parts=[];floats=[];lastSpawn=-9;
  initAudio();oceanFade(true);setTimeout(buildClap,60);ov.hidden=true;ans.style.visibility='visible';ans.classList.remove('bad');showAns();hud();
}
function end(){
  st='over';typed='';ans.style.visibility='hidden';oceanFade(false);
  try{localStorage.setItem('bmb-best',best)}catch(e){}
  setTimeout(()=>{if(st!=='over')return;$('ovT').textContent='Out of lives';
    $('ovP').textContent=`You scored ${score}. Your best is ${best}. Ready for another round?`;
    $('go').textContent='Play again';ov.hidden=false;$('go').focus()},700);
}
function quit(){
  if(st!=='play')return;
  clearTimeout(matchTimer);clearTimeout(badTimer);
  st='over';typed='';bubbles=[];ans.style.visibility='hidden';oceanFade(false);
  try{localStorage.setItem('bmb-best',best)}catch(e){}
  $('ovT').textContent='Game ended';
  $('ovP').textContent=`You scored ${score}. Your best is ${best}. Ready for another round?`;
  $('go').textContent='Play again';ov.hidden=false;$('go').focus();
}
$('go').addEventListener('click',start);
$('snd').addEventListener('click',e=>{e.currentTarget.blur();toggleSound()});
$('quit').addEventListener('click',e=>{e.currentTarget.blur();quit()});
// one input path for the physical keyboard and the on-screen keypad
function press(k){
  if(st!=='play')return;
  if(/^\d$/.test(k)){if(typed.length<4)typed+=k;showAns();check()}
  else if(k==='Backspace'){typed=typed.slice(0,-1);clearTimeout(matchTimer);release();showAns()}
  else if(k==='Escape'){typed='';clearTimeout(matchTimer);release();showAns()}
}
addEventListener('keydown',e=>{
  if(e.key==='m'||e.key==='M'){toggleSound();return}
  if(st!=='play'){if(e.key==='Enter'||e.key===' '){e.preventDefault();start()}return}
  if(/^\d$/.test(e.key)||e.key==='Backspace'||e.key==='Escape'){press(e.key);e.preventDefault()}
});
const pad=$('pad');
['1','2','3','4','5','6','7','8','9','⌫','0','C'].forEach(k=>{const b=document.createElement('button');b.textContent=k;b.dataset.k=k==='⌫'?'Backspace':k==='C'?'Escape':k;b.setAttribute('aria-label',k==='⌫'?'Backspace':k==='C'?'Clear':k);pad.appendChild(b)});
pad.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();press(b.dataset.k)});

// update
function update(dt){
  T+=dt;
  for(const d of decoys){
    d.y+=d.v*dt;
    if(d.y-d.r>sandY+6){if(parts.length<260)splash(d.x,sandY,3,'200,235,255');Object.assign(d,newDecoy(false));d.y=-d.r}
  }
  if(st==='play'){
    t+=dt;levelTime+=dt;
    if(streak>=6&&levelTime>=25&&level<8){level++;streak=0;levelTime=0;float(W/2,H*.3,'Level '+(level+1),'#1d3b5c',56,2.2);sClap();hud()}
    const target=t<3?2:t<4?3:t<5?4:6;
    if(bubbles.length<target&&t-lastSpawn>.7)spawn();
    for(const b of bubbles.slice()){
      b.y+=b.v*dt;b.x=b.x0+Math.sin(T*1.3+b.ph)*12;
      if(!bubbles.includes(b))continue;
      if(!b.seen&&vis(b)){b.seen=true;if(typed)check()}
      if(b.y>=sandY+2){if(b.hold)b.y=sandY+1;else lose(b)}
    }
  }
  for(const p of parts){p.vy+=620*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}
  parts=parts.filter(p=>p.l>0);
  for(const f of floats){f.y-=40*dt;f.l-=dt}
  floats=floats.filter(f=>f.l>0);
  shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt*2.2);
}

// drawing
function cloud(x,y,s){
  const cs=[[0,0,26],[28,-10,32],[60,0,26],[30,8,26]];
  ctx.lineWidth=7;ctx.strokeStyle=INK;ctx.fillStyle='#fff';
  cs.forEach(([a,b,r])=>{ctx.beginPath();ctx.arc(x+a*s,y+b*s,r*s,0,7);ctx.stroke()});
  cs.forEach(([a,b,r])=>{ctx.beginPath();ctx.arc(x+a*s,y+b*s,r*s,0,7);ctx.fill()});
}
function star(x,y,R,rot){
  ctx.beginPath();
  for(let i=0;i<10;i++){const r=i%2?R*.45:R,a=rot+i*Math.PI/5-Math.PI/2;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}
  ctx.closePath();ctx.fillStyle='#ff8a5c';ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.lineJoin='round';ctx.fill();ctx.stroke();
}
function palm(px,py){
  const tx=px-W*.05,ty=py-H*.3;
  ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(px,py);ctx.quadraticCurveTo(px+30,(py+ty)/2,tx,ty);
  ctx.lineWidth=22;ctx.strokeStyle=INK;ctx.stroke();ctx.lineWidth=14;ctx.strokeStyle='#c68b52';ctx.stroke();
  for(let i=0;i<7;i++){
    const a=-Math.PI+.25+i*(Math.PI-.5)/6+Math.sin(T*1.2+i)*.04,L=H*.17;
    const cx=tx+Math.cos(a)*L*.55,cy=ty+Math.sin(a)*L*.55-24,ex=tx+Math.cos(a)*L,ey=ty+Math.sin(a)*L*.7+34;
    ctx.beginPath();ctx.moveTo(tx,ty);ctx.quadraticCurveTo(cx,cy,ex,ey);ctx.quadraticCurveTo(cx,cy+26,tx,ty+4);
    ctx.fillStyle=i%2?'#2fa866':'#3cc67b';ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.lineJoin='round';ctx.fill();ctx.stroke();
  }
  ctx.fillStyle='#7a4b24';[[-8,10],[8,12]].forEach(([a,b])=>{ctx.beginPath();ctx.arc(tx+a,ty+b,9,0,7);ctx.fill();ctx.lineWidth=3;ctx.stroke()});
}
function scene(){
  ctx.drawImage(skyBase,0,0,skyBase.width/dpr,skyBase.height/dpr);
  // sun
  const sx=W*.8,sy=H*.15,R=48*S;
  ctx.lineCap='round';ctx.strokeStyle=INK;ctx.lineWidth=5;
  for(let i=0;i<12;i++){const a=i*Math.PI/6+T*.25;ctx.beginPath();ctx.moveTo(sx+Math.cos(a)*R*1.3,sy+Math.sin(a)*R*1.3);ctx.lineTo(sx+Math.cos(a)*R*1.67,sy+Math.sin(a)*R*1.67);ctx.stroke()}
  ctx.beginPath();ctx.arc(sx,sy,R,0,7);ctx.fillStyle='#ffd23f';ctx.fill();ctx.stroke();
  // clouds
  [[.1,22,.8,H*.1],[.45,14,1.1,H*.2],[.7,18,.7,H*.07]].forEach(([o,sp,s,y])=>{
    cloud(((o*W+T*sp)%(W+240))-120,y,s*S);
  });
  // sea
  ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,horizon);ctx.lineTo(W,horizon);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=3;
  for(let i=0;i<6;i++){
    const y=horizon+(sandY-horizon)*(i+1)/7;ctx.beginPath();
    for(let x=0;x<=W;x+=14)ctx.lineTo(x,y+Math.sin(x*.03+T*(1+i*.15)+i)*(3+i));
    ctx.stroke();
  }
  palm(W*.92,sandY+10);
}
function sand(){
  const ys=x=>sandY+Math.sin(x*.012+T*.9)*6;
  const path=o=>{ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W+10;x+=10)ctx.lineTo(x,ys(x)+o);ctx.lineTo(W,H);ctx.closePath()};
  path(-8);ctx.fillStyle='#fff';ctx.fill();
  path(0);
  ctx.fillStyle=sandG;ctx.fill();
  ctx.drawImage(sandBase,0,sandTop,sandBase.width/dpr,sandBase.height/dpr);
  ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.stroke();
}
function drawBubbles(){
  ctx.globalAlpha=1;
  for(const d of decoys){
    const x=d.x+Math.sin(T*1.1+d.ph)*8;
    ctx.globalAlpha=d.a;ctx.drawImage(sprites[d.sp],x-d.r,d.y-d.r,d.r*2,d.r*2);
  }
  ctx.globalAlpha=1;ctx.textAlign='center';ctx.textBaseline='middle';
  for(const b of bubbles){
    ctx.beginPath();ctx.arc(b.x,b.y,b.r-2,0,7);ctx.fillStyle='rgba(255,255,255,.62)';ctx.fill();
    ctx.drawImage(sprites[0],b.x-b.r,b.y-b.r,b.r*2,b.r*2);
    if(typed&&vis(b)&&String(b.ans).startsWith(typed)){ctx.beginPath();ctx.arc(b.x,b.y,b.r+5,0,7);ctx.lineWidth=5;ctx.strokeStyle='#ffd23f';ctx.stroke()}
    ctx.font=F(26*S);ctx.fillStyle=INK;ctx.fillText(b.eq,b.x,b.y+3);
  }
}
function fx(){
  for(const p of parts){ctx.fillStyle=`rgba(${p.c},${Math.min(1,p.l*2)})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const f of floats){
    ctx.globalAlpha=Math.min(1,f.l);ctx.font=F(f.size);ctx.lineWidth=7;ctx.strokeStyle='#fff';ctx.lineJoin='round';
    ctx.strokeText(f.txt,f.x,f.y);ctx.fillStyle=f.c;ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;
}
function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake*30,(Math.random()-.5)*shake*30);
  scene();sand();drawBubbles();fx();
  ctx.restore();
  if(flash>0){ctx.fillStyle=`rgba(255,70,60,${flash*.28})`;ctx.fillRect(0,0,W,H)}
}

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);draw();requestAnimationFrame(loop);
}
if(window.matchMedia&&matchMedia('(pointer:coarse)').matches)$('ovP').textContent='Bubbles with sums are falling toward the sand. Tap the answer on the keypad to pop each one before it lands. You have 5 lives.';
resize();hud();showAns();
requestAnimationFrame(loop);
$('go').focus();
// offline play and instant repeat visits
if('serviceWorker'in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
